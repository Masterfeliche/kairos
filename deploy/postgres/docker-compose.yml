# Production Postgres for DIT Smart Timetable.
#
#   cp .env.example .env      # then set a strong POSTGRES_PASSWORD
#   docker compose up -d
#
# The deploy.tz API app connects to it with:
#   TT_DATABASE_URL=postgresql://timetable:<password>@<this-server-host>:5432/timetable
# Only open the published port to the internet if deploy.tz needs to reach it over the
# public network, and then restrict it with a firewall (see docs/17-deployment.md).
services:
  postgres:
    image: postgres:16-alpine
    container_name: timetable-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timetable}
      POSTGRES_USER: ${POSTGRES_USER:-timetable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Password auth for remote connections (the image default, stated explicitly).
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TZ: Africa/Dar_es_Salaam
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timetable-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timetable} -d ${POSTGRES_DB:-timetable}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timetable-pgdata:
